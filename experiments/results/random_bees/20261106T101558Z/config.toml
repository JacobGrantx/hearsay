# Baseline for E1: random intents and random sounds. No model.
# Full-size world with the calibrated values (EXPERIMENTS.md, "Setup calibration").
[experiment]
name = "random_bees"
entrypoint = "digital_life.sim:run"
hypothesis = "Scripted random bees set the comparison level for the AI colony."
seeds = [0, 1, 2, 3, 4]

[params]
condition = "random_bees"
width = 80
height = 48
season_length = 250
years = 2
base_life = 500
min_bloom_distance = 55
openness = 0.15
ambush_rate = 0.02
hornet_speed = 0.8
