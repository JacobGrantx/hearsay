# E2 comparison: AI bees as in `full`, hornet genes fixed at the seed's initial draw.
# Full-size world with the calibrated values (EXPERIMENTS.md, "Setup calibration"). Pre-registered in EXPERIMENTS.md.
# Bee minds: claude-haiku-5-5, effort low, thinking disabled, structured output (src/digital_life/mind.py).
[experiment]
name = "frozen_hornets"
entrypoint = "digital_life.sim:run"
hypothesis = "With evolving hornets, sting rates rise over time against the same bees; frozen hornets show no such rise."
seeds = [0, 1, 2]

[params]
condition = "frozen_hornets"
width = 80
height = 48
season_length = 250
years = 2
base_life = 500
min_bloom_distance = 55
openness = 0.15
ambush_rate = 0.02
hornet_speed = 0.8
mind_model = "claude-haiku-5-5"
mind_effort = "low"
mind_max_tokens = 400
