# E1-E4 main arm: AI bees with memory, hive talk and neutral sounds.
# Full-size world with the calibrated values (EXPERIMENTS.md, "Setup calibration"). Pre-registered in EXPERIMENTS.md.
# Bee minds: claude-haiku-5-5, effort low, thinking disabled, structured output (src/digital_life/mind.py).
[experiment]
name = "full"
entrypoint = "digital_life.sim:run"
hypothesis = "AI colonies with memory and hive talk deliver more per trip than rule bees and the ablations, and spring delivery comes earlier in year 2 than in year 1."
seeds = [0, 1, 2]

[params]
condition = "full"
width = 80
height = 48
season_length = 250
years = 2
base_life = 500
min_bloom_distance = 55
openness = 0.15
ambush_rate = 0.02
hornet_speed = 0.8
mind_model = "claude-haiku-5-5"
mind_effort = "low"
mind_max_tokens = 400
